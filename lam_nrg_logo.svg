<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d2b1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff50" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ff50" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gf2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0a" rx="20"/>
  <circle cx="200" cy="200" r="185" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="190" fill="url(#glow)"/>

  <!-- Outer rings -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="rgba(0,255,80,0.18)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(0,255,80,0.08)" stroke-width="1"/>

  <!-- Speed arc — main glowing arc (top-right) -->
  <path d="M 200 30 A 170 170 0 0 1 348 268" fill="none" stroke="#00ff50" stroke-width="3.5" stroke-linecap="round" filter="url(#gf2)" opacity="0.95"/>
  <!-- Fading arcs -->
  <path d="M 348 268 A 170 170 0 0 1 52 268" fill="none" stroke="rgba(0,255,80,0.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 52 268 A 170 170 0 0 1 200 30" fill="none" stroke="rgba(0,255,80,0.10)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arc tick marks -->
  <g stroke="#00ff50" stroke-width="2.5" stroke-linecap="round" filter="url(#gf)">
    <line x1="200" y1="30"  x2="200" y2="46"/>
    <line x1="288" y1="48"  x2="280" y2="62"/>
    <line x1="348" y1="130" x2="333" y2="138"/>
    <line x1="370" y1="200" x2="354" y2="200"/>
    <line x1="348" y1="268" x2="334" y2="260"/>
  </g>
  <g stroke="rgba(0,255,80,0.4)" stroke-width="1.5" stroke-linecap="round">
    <line x1="244" y1="36"  x2="239" y2="50"/>
    <line x1="320" y1="82"  x2="308" y2="93"/>
    <line x1="362" y1="165" x2="347" y2="168"/>
  </g>

  <!-- Hexagon frame -->
  <polygon points="200,90 268,129 268,207 200,246 132,207 132,129"
           fill="rgba(0,255,80,0.05)" stroke="#00ff50" stroke-width="2" opacity="0.8"/>
  <!-- Inner hex -->
  <polygon points="200,105 254,136 254,198 200,229 146,198 146,136"
           fill="rgba(0,0,0,0.6)" stroke="rgba(0,255,80,0.3)" stroke-width="1"/>

  <!-- Eco leaf shape -->
  <path d="M200 110 C228 128, 244 158, 232 180 C220 200, 188 206, 172 190 C156 174, 160 144, 200 110Z"
        fill="rgba(0,255,80,0.12)" stroke="#00ff50" stroke-width="1.5" filter="url(#gf)"/>

  <!-- Lightning bolt — centred in hex -->
  <path d="M212 115 L188 170 L204 170 L186 225 L226 158 L208 158 Z"
        fill="#00ff50" filter="url(#gf2)" opacity="0.95"/>

  <!-- LAM lettering -->
  <text x="200" y="292" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="26" font-weight="900" letter-spacing="14"
        fill="#00ff50" filter="url(#gf)">LAM</text>

  <!-- NRG sub-lettering -->
  <text x="200" y="318" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="15" font-weight="700" letter-spacing="12"
        fill="rgba(255,255,255,0.45)">NRG</text>

  <!-- Bottom label -->
  <text x="200" y="355" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" font-weight="600" letter-spacing="4"
        fill="rgba(0,255,80,0.4)">SHELL ECO-MARATHON</text>

  <!-- Glowing dot at arc start -->
  <circle cx="200" cy="30" r="5" fill="#00ff50" filter="url(#gf2)"/>
  <circle cx="348" cy="268" r="4" fill="#00ff50" filter="url(#gf)" opacity="0.5"/>
  <circle cx="52"  cy="268" r="3" fill="#00ff50" filter="url(#gf)" opacity="0.25"/>
</svg>
